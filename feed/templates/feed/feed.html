<h2>Your Feed</h2>

<form method="post" action="{% url 'create_activity' %}">
  {% csrf_token %}
  <textarea name="content" placeholder="What are you up to?" required></textarea><br>
  <button type="submit">Post</button>
</form>

<div id="feed-container">
  {% for activity in activities %}
    <div class="activity">
      <b>{{ activity.user.username }}</b>: {{ activity.content }}
    </div>
  {% endfor %}
</div>

<script>
const socket = new WebSocket("ws://" + window.location.host + "/ws/connect/"); // same as your existing connect route

socket.onmessage = function(e) {
  const data = JSON.parse(e.data);

  if (data.type === "feed_update") {
    const feed = document.getElementById("feed-container");
    const div = document.createElement("div");
    div.classList.add("activity");
    div.innerHTML = `<b>${data.activity.user}</b>: ${data.activity.content}`;
    feed.prepend(div);
  }
};
</script>
