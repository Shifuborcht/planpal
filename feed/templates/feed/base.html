<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}PlanPal{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #007bff;
            color: white;
            padding: 15px;
        }
        header h1 {
            margin: 0;
        }
        nav {
            margin-top: 10px;
        }
        nav a {
            display: inline-block;
            margin: 5px 10px;
            padding: 10px 15px;
            background-color: #0056b3;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
        nav a:hover {
            background-color: #004080;
        }
        main {
            padding: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1>PlanPal</h1>
        {% if request.user.is_authenticated %}
            <p>Welcome, <strong>{{ request.user.username }}</strong>!</p>
        {% endif %}
        <nav>
            <a href="{% url 'index' %}">🏠 Home</a>
            <a href="{% url 'suggestions' %}">💡 Suggestions</a>
            <a href="{% url 'friends' %}">Friends</a>
            <a href="{% url 'logout' %}">🚪 Logout</a>
        </nav>
    </header>

    <main>
        {% block content %}
        <!-- child templates will fill this -->
        {% endblock %}
    </main>
</body>
